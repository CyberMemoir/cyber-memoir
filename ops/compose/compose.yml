name: cyber-memoir
x-backend: &backend
  build:
    context: ../..
    dockerfile: apps/backend/Dockerfile
    args:
      INSTALL_MODELS: ${INSTALL_MODELS:-false}
  env_file: ../../.env
  environment:
    DATABASE_URL: postgresql+psycopg://memoir:${POSTGRES_PASSWORD:?run make configure}@postgres:5432/memoir
    REDIS_URL: redis://redis:6379/0
    OPENSEARCH_URL: http://opensearch:9200
    S3_ENDPOINT: http://minio:9000
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memoir
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make configure}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoir -d memoir"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:59200:9200"]
    volumes: ["opensearch:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?run make configure}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?run make configure}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["objects:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    command: ["uvicorn", "cyber_memoir.api.main:app", "--host", "0.0.0.0", "--port", "8100"]
    ports: ["127.0.0.1:8100:8100"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "-m", "cyber_memoir.workers.main"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      minio: {condition: service_healthy}
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3100:3100"]
    environment:
      API_INTERNAL_URL: http://api:8100
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres:
  redis:
  opensearch:
  objects:
