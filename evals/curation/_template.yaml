# 策展记录模板 —— 每个梗一个文件，文件名用 slug，例如 evals/curation/ji-ni-tai-mei.yaml
#
# 这份文件是事实来源。gold.jsonl 由它生成，不要手工维护两份。
# 依据 ADR 0002（金标准策展标准）与 ADR 0003（站外来源）。
#
# 两个阶段：
#   1. 策展阶段 —— resolved: false。先写事实判断，evidence 用占位名，不写真实 ID。
#   2. 落库阶段 —— resolved: true。素材入库后把占位名映射到真实 evidence ID。
# 校验器对两个阶段用不同规则：python evals/validate_curation.py evals/curation/

slug: ji-ni-tai-mei          # 文件级唯一标识，小写、连字符
resolved: false              # 素材入库并填好 evidence ID 后改为 true

# ---------- 条目本体（对应 MemeDraft） ----------

canonical_name: 鸡你太美      # 1–200 字符。gold 用它精确匹配，定下后不要随手改
aliases:                     # 最多 50 条。规范化后不得与其它梗冲突，校验器会查
  - 只因你太美
  - ikun

definition: |-               # 必填。用 |- 保证不产生结尾换行，见文件末尾说明
  形容某人自我感觉良好的表演，出自一段篮球宣传片段的谐音改写。
usage_context: |-            # 可留空。非空时同样必须有逐字相同的 claim
  多用于调侃他人动作浮夸或过度表演，语气偏戏谑，不适合正式场合。

origin_status: unknown       # unknown | supported | disputed
                             # supported 需要 origin claim + claimed_origin 关系指向 Source

# ---------- 策展事实（run.py 不读，人工判断的载体） ----------

taxonomy:                    # 取自 internet-meme-radar-skill/references/taxonomy.md
  - catchphrase
  - audio
platform_primary: bilibili   # bilibili | douyin
material_path: subtitle      # subtitle | asr | ocr | manual —— 实际拿到材料的途径

origin_type: off_platform_media
  # on_platform | off_platform_media | live | text_forum | offline | unknown
origin_ref: |-               # 站外起源的描述：作品/事件名 + 时间 + 载体。没有 URL 也要写
  篮球宣传拍摄片段，2018 年，电视/网络视频，待二级来源佐证
origin_blocked: true         # 当前 schema 是否无法表达该起源
origin_blocked_reason: |-    # ADR 0003 的证据。写清楚卡在哪一步
  站外来源没有 platform_item_id；review() 在 origin_status=supported 时
  要求 claimed_origin 关系指向 Source 行，因此审核会被直接拒绝。

earliest_artifact_url: https://www.bilibili.com/video/BVxxxxxxxxxx
top_amplifier_url: https://www.bilibili.com/video/BVyyyyyyyyyy
                             # 起源与最高播放是否同一条 —— 这一列用来回答那个问题
derivatives:
  - https://www.bilibili.com/video/BVzzzzzzzzzz

sources:                     # 本条目实际提交的来源
  - url: https://www.bilibili.com/video/BVxxxxxxxxxx
    role: earliest_artifact  # origin | earliest_artifact | amplifier | derivative | reference
    note: 站内可见最早记录，本身是搬运

# ---------- 断言（claims / events / relations） ----------
# evidence 在 resolved: false 时写占位名，resolved: true 时写真实 evidence ID。
# 占位名在 evidence_map 中声明。

evidence_map:                # 占位名 -> 真实 ID（resolved: true 时必须全部填上）
  sub-0012: null
  meta-title: null

claims:
  - key: definition          # definition | usage_context | origin | alias
    statement: |-            # definition/usage_context 的 statement 必须与上面字段逐字相同
      形容某人自我感觉良好的表演，出自一段篮球宣传片段的谐音改写。
    evidence: [sub-0012]
    stance: supports         # supports | contradicts
  - key: usage_context
    statement: |-
      多用于调侃他人动作浮夸或过度表演，语气偏戏谑，不适合正式场合。
    evidence: [sub-0012, meta-title]
    stance: supports

events: []
  # - event_type: observed_use     # observed_use | spread | remix | origin_claim
  #   description: 站内可见最早使用记录
  #   occurred_at_start: 2019-03-14T00:00:00+08:00   # 必须带时区
  #   time_precision: day          # unknown | year | month | day | second
  #   time_basis: 平台显示的投稿时间
  #   evidence: [meta-title]

relations: []
  # - predicate: derived_from      # derived_from→meme, variant_of→meme,
  #   target_type: meme            # claimed_origin→source, documented_in→source, mentions→entity
  #   target_id: <另一条已发布梗的 ID>
  #   assertion_status: supported  # supported | disputed
  #   evidence: [sub-0012]

# ---------- 评测用例（生成 gold.jsonl 的输入） ----------

gold:
  canonical:                 # 用规范名检索
    - 鸡你太美
  alias:                     # 不同表述、同一 expected_names。最有价值的一类
    - 只因你太美
    - ikun 什么意思
  origin_intent:             # 含 出处/起源/最早/谁先/首创
    - 鸡你太美的出处
  polysemy: []               # 一名多义时，用于区分的查询（OPERATIONS.md 要求）
  adversarial: []            # 用本梗材料里的词去查别的梗，检验重排是否给出自信错答
  must_not_return: []        # 这些查询不应返回本条目；用于交叉检查，不直接进 gold.jsonl

# ---------- 策展记录 ----------

curation:
  curator: ""
  started_at: 2026-09-08
  completed_at: null
  minutes_spent: null
  ingestion_ok: true         # yt-dlp 是否成功取到材料。false 计入平台失败率
  ingestion_note: ""
  findings:                  # 设计日志：想记录却记不了 / 想看却看不到
    - 站外起源无法表达，见 origin_blocked_reason

# YAML 提示：
#   |-  保留内部换行、去掉结尾换行 —— 需要逐字匹配的字段一律用它
#   >-  会把换行折成空格，容易导致 statement 与 definition 不一致
#   普通引号字符串里的换行也会变成空格
# statement 与 definition 必须完全相同（含空格），审核时按字节比对，差一个空白就 422。
