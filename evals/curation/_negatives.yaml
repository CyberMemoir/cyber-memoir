# 反例查询 —— 不属于任何条目，因此单独成文件。
#
# 这些是「库里不该有答案」的查询。run.py 把它们写成 answerable: false 的行，
# 而 correct_abstention 只在这类行上计算：没有反例，弃答率就是 None，不是 0。
# ADR 0002 要求不少于 8 条。
#
# 与条目内的 must_not_return 不是一回事：
#   must_not_return  —— 这条查询不应返回「本条目」。用于交叉检查，不进 gold.jsonl。
#   本文件           —— 这条查询不应返回「任何条目」。进 gold.jsonl，计入弃答率。
# 前者能被一个自信的错答蒙混过去（没返回 A，但自信地返回了 B）；后者不能。
#
# 由人工策展，不由代码或模型生成（ADR 0002 条款 1、条款 5）。
# 校验器会检查每条 query 是否与已策展条目的规范名或别名冲突 —— 撞上了就不是反例。
#
# 格式：
#   - query: <检索词>
#     reason: <为什么它在本库里不该有答案>
#
# 例（勿直接使用，请换成策展人确认过的查询）：
#   - query: 这不是一个真实存在的梗
#     reason: 构造的字符串，不对应任何真实表述

negatives: []
