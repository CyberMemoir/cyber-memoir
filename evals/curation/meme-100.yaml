  drafted_by: deepseek-v4.1-flash
  confirmed_by: Vincent
  draft_basis: '003.0s 躲猫猫可以说是最经典的一种游戏形式之一

    015.0s 玩法呢是玩家可以变形成各种物件融入地图之中

    021.0s 《MECCHA CHAMELEON》（超级变色龙）的游戏风靡一时

    024.0s 由两位日本作者独立开发

    031.0s 这个躲猫猫游戏呢和前面的prophunt差不多

    034.0s 最大的区别在于玩家不能变身为其他物体而是能摆出一些姿势

    038.0s 然后在自己的身体上上色

    040.0s 尽可能的让自已融入环境

    044.0s 没过一段时间这游戏便被大家玩出了花

    047.0s 各种好活烂活都能见着就像下面这些'
  draft_notes: '段落：整集一个梗。003-018s 是躲猫猫通史（gmod／cod 的 prophunt），021s 起才讲本梗；定义只取 021s
    之后。

    用法留空（D-10）：044s 玩出了花、047s 各种好活烂活是现象和传播，整集没有陈述用法的句子。

    可疑 OCR：025s「分别是毛才(LEMORION)(HAGANEIRO)」两位日本作者的名字读得可疑，我没有把名字写进正文；018s「博奔」（博弈？）；069s「这是什么」读不通。'
