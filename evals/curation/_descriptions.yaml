# 描述型检索用例：用你自己的话描述这个梗，不含梗名、不含别名。
# 在做 role 那一遍时就写，也就是在读到任何模型草稿之前 —— 否则查询会借用草稿的措辞，
# 召回率会被虚高，这组用例也就失去了检验作用。
#
# prep.py drafts 生成新草稿时把这里的查询抄进 gold.description；已存在的记录不受影响。
# 模型起草的记录至少要有一条，否则 validate_curation.py 报错、不能入库。
# 含冒号「:」的查询要加引号。
#
# 格式（梗名与 lineage.csv 的 meme_name 一致）：
#
# 梗名:
#   - 第一条：你会怎么向没听过的人描述它
#   - 第二条（可选）：你会在什么情境下搜它
  大狗叫: 
    - 大狗和焦混乱出现组成非常雷霆且猎奇的音频，会有一只狗表情狰狞张着嘴
    - 刷到焦~
  宗主第二招: 
    - 蔡徐坤跳舞
  许愿柳: 
    - 对着一根可以掰断的东西许下愿望，然后它就以意想不到的方式实现了
    - 觉得一个东西像 THe Monkey's Paw
  AVGN舞: 
    - 一个游戏人物莫名其妙开始双手上下摆动跳舞
  XX人吃到美食: 
    - 一只乌龟用很力竭的声音说可是他们在辣椒炒肉里放糖
  干瘪瘪的芝士球: 
    - 一个头像外面套了个芝士球
  《正太扭腰》: 
    - 左边画个虫虫
  大阪和摄政王: 
    - 他们为什么要拆cp
  被生活磨平了妙脆角:
    - 这个特效给我猫耳朵丢了
  佛得角门神: 
    - 佛得角是怎么跟强队打平的
  你会XXX吗: 
    - 为什么全在骂阿辙
  大葱哥:
    - 这个带着墨镜的大葱是谁
  才是王道:
    - 像素风没有技巧是何意味
  松针大油边:
    - 美食视频旁边有个人一直捧哏是啥意思
  泥肘: 
    - 你欺负人怎么换成更可爱的说法
  熊大回眸:
    - 最近很难绷的熊大动画
