  draft_basis: '003.0s 这个梗呢来源于最近参加CS2IEM科隆Major的Team Spirit战队

    007.0s 也就是大家俗称的绿龙

    019.0s 所以绿龙的两个教练都无法前往科隆线下指挥

    027.0s 结果在瑞士轮开赛时绿龙的传奇选手donk抱着一只青蛙玩偶上场

    031.0s 并把他摆在战队身后的椅子上

    033.0s 不仅塞了瓶水还戴上教练耳机

    048.0s 在这位青蛙教练的执教绿龙往瑞士轮居然3-0（x2）全胜出线了！

    083.0s 战队官方和粉丝们也是疯狂玩梗

    085.0s 为这位青蛙教练制作了无数的传奇二创'
  draft_notes: '段落：整集一个梗。003-085s 是解说；088s 之后是二创歌曲的歌词，OCR 落在解说流里，我没有用。

    用法留空（D-10）：083s 疯狂玩梗、085s 无数二创都是传播；035s「稳定军心」的「军中大将」是描述，不是用法。

    可疑 OCR：014s「HALLY」、017s「SOtF1k」是两个教练 ID，大小写像误读；048s「3-0（x2）」里的 x2 我没写进正文（D-3 拿不准就不写）。'
